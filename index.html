<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rm-vim-tails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0c0f14; --panel:#141a22; --line:#232c38; --fg:#e8eef4; --dim:#7d8b99; --acc:#7ee2a8; --gem:#ffd15c; --bad:#ff6b6b; --ins:#7cc4ff;
          --win1:#2b3fa8; --win2:#121a55; --t:34px; --pixel:'Press Start 2P', ui-monospace, monospace; --mono:ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--mono); min-height:100vh; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:18px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font:14px var(--pixel); color:var(--acc); margin:0; }
  #chap { font:11px var(--pixel); color:var(--gem); }
  .hud { display:flex; gap:16px; margin-left:auto; align-items:center; }
  .hud button, .btn { background:var(--line); color:var(--fg); border:1px solid #344152; border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  .hud button:hover, .btn:hover { border-color:var(--acc); }
  #layout { display:grid; grid-template-columns:1fr 280px; gap:16px; padding:16px; }
  #view { background:#000; border:4px solid #000; border-radius:8px; overflow:auto; max-height:calc(100vh - 190px); outline:2px solid var(--line); }
  #map { display:grid; width:max-content; background:var(--floor); }
  #map .g { color:#ffffff55; font-size:10px; text-align:right; padding:0 6px; line-height:var(--t); background:#0008; position:sticky; left:0; z-index:2; }
  .t { width:var(--t); height:var(--t); display:grid; place-items:center; font-size:calc(var(--t) * .72); line-height:1; position:relative; }
  .t.path { background:#ffffff22; }
  .t.water { background:linear-gradient(135deg, #1d5f9c, #2b7bc0, #1d5f9c); background-size:200% 200%; animation:wave 3s ease-in-out infinite; }
  .t.stone { background:#1d5f9c; }
  .t.stone::after { content:''; position:absolute; inset:5px; background:#b8a27a; border-radius:40%; box-shadow:inset -3px -3px #8a7652; }
  .t.wall { background:#00000033; }
  .t.island { background:#1d5f9c; }
  .t.island::after { content:''; position:absolute; inset:7px; background:#d9c48f; border-radius:50%; }
  .t.open { opacity:.55; }
  .hero { display:inline-block; animation:bob .5s ease-in-out infinite alternate; z-index:1; filter:drop-shadow(0 2px 0 #0008); }
  .roam { animation:wiggle .4s steps(2) infinite; }
  .foe-tile { animation:wiggle .8s steps(2) infinite; }
  @keyframes bob { to { translate:0 -3px; } }
  @keyframes wiggle { 50% { rotate:-8deg; } }
  @keyframes wave { 50% { background-position:100% 100%; } }
  .status { display:flex; gap:18px; padding:6px 12px; margin-top:8px; background:var(--panel); border-radius:6px; color:var(--dim); min-height:34px; flex-wrap:wrap; }
  .mode { color:var(--acc); font-weight:bold; } .mode.insert { color:var(--ins); }
  .pending { color:var(--gem); }
  #note { color:var(--fg); }
  aside { display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .box h3 { font:10px var(--pixel); color:var(--dim); margin:0 0 10px; letter-spacing:1px; }
  .spell { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg); font:inherit; padding:5px 6px; border-radius:6px; }
  .spell[data-id] { cursor:pointer; } .spell[data-id]:hover { background:var(--line); }
  .spell small { color:var(--dim); display:block; } .spell b { color:var(--gem); font-weight:normal; float:right; }
  kbd { background:var(--line); border:1px solid #344152; border-bottom-width:3px; border-radius:5px; padding:0 5px; color:var(--acc); font:inherit; }
  .help { color:var(--dim); font-size:13px; } .help p { margin:4px 0; }
  .win { background:linear-gradient(var(--win1), var(--win2)); border:3px solid #e8e8f0; border-radius:8px; box-shadow:0 0 0 3px #000, 0 8px 24px #000a; color:#fff; }
  #dialog { position:fixed; left:50%; bottom:44px; translate:-50% 0; width:min(760px, calc(100vw - 32px)); padding:16px 20px 24px; z-index:20; }
  #dialog[hidden], #battle[hidden] { display:none; }
  #who { font:11px var(--pixel); color:var(--gem); margin-bottom:10px; }
  #say { font:13px/1.9 var(--pixel); margin:0; min-height:3.8em; }
  .more { position:absolute; right:14px; bottom:8px; font:10px var(--pixel); animation:bob .4s infinite alternate; }
  #flash { position:fixed; inset:0; background:var(--bad); opacity:0; pointer-events:none; transition:opacity .4s; z-index:30; }
  #battle { position:fixed; inset:0; z-index:10; overflow:auto; background:radial-gradient(ellipse at 50% 30%, #3b2a5c, #0c0f14 70%); padding:16px; }
  .bwrap { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .arena { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:8px 24px 0; min-height:170px; }
  .fighter { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .sprite { font-size:96px; line-height:1; filter:drop-shadow(0 8px 0 #0006); }
  #foeIcon { animation:bob 1s ease-in-out infinite alternate; }
  .sprite.hit { animation:shake .3s !important; filter:brightness(3) drop-shadow(0 8px 0 #0006); }
  .sprite.dead { opacity:0; transition:opacity .6s, scale .6s; scale:.3; }
  #meIcon { --t:110px; }
  /* the hero: a living terminal prompt with a blinking cursor */
  .term { display:inline-grid; place-items:center; width:calc(var(--t) * .86); height:calc(var(--t) * .7); background:#050805; border:2px solid var(--acc);
          border-radius:4px; color:var(--acc); font:bold calc(var(--t) * .34) var(--mono); box-shadow:0 0 calc(var(--t) * .25) #7ee2a877; text-shadow:0 0 4px var(--acc); }
  .term i { font-style:normal; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes shake { 25% { translate:-8px 0; } 75% { translate:8px 0; } }
  .stat { padding:8px 14px; min-width:240px; font:10px/1.8 var(--pixel); }
  .bar { height:10px; background:#0008; border:2px solid #fff; border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--bad); transition:width .25s; }
  .bar.me i { background:var(--acc); }
  .lesson { padding:12px 16px; }
  .lesson .keys { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:6px; color:#c9d3ff; }
  .lesson p { margin:0; color:#dfe6ff; }
  .panes { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .panes.solo { grid-template-columns:1fr; }
  .pane { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .pane h4 { margin:0; padding:6px 12px; font:9px var(--pixel); color:var(--dim); border-bottom:1px solid var(--line); }
  .pane[hidden] { display:none; }
  .buf { padding:10px 0; white-space:pre; font-size:17px; overflow-x:auto; }
  .ln { padding-right:12px; min-height:1.5em; }
  .ln i { display:inline-block; width:3.2em; padding-right:1em; text-align:right; color:var(--dim); font-style:normal; border-left:3px solid transparent; }
  .ln.bad i { border-left-color:var(--bad); } .ln.ok { color:var(--acc); }
  .cur { background:var(--acc); color:var(--bg); } .cur.ins { background:none; color:inherit; box-shadow:inset 2px 0 var(--ins); }
  .gem { color:var(--gem); font-weight:bold; } .got { color:var(--dim); } .gem.cur, .got.cur { color:var(--bg); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #bHint { color:var(--gem); }
  body { padding-bottom:30px; }
  #cmd { position:fixed; left:0; right:0; bottom:0; height:28px; padding:4px 12px; background:#000; color:var(--fg); font:15px var(--mono); white-space:pre; z-index:40; border-top:1px solid var(--line); }
  #cmd.err { color:var(--bad); }
  @media (max-width:900px) { #layout { grid-template-columns:1fr; } .panes { grid-template-columns:1fr; } .sprite { font-size:64px; } }
</style>
</head>
<body>
<header>
  <h1>&gt;_ rm-vim-tails</h1>
  <span id="chap"></span>
  <div class="hud"><span id="hearts"></span><span id="gold"></span><span id="keysHud"></span><span id="lv"></span><span id="stars"></span></div>
</header>
<div id="layout">
  <main>
    <div id="view"><div id="map"></div></div>
    <div class="status"><span class="mode">NORMAL</span><span class="pending" id="mPending"></span><span id="note"></span></div>
  </main>
  <aside>
    <div class="box"><h3>SPELLBOOK</h3><div id="book"></div></div>
    <div class="box help"><h3>COMMANDS</h3>
      <p>Type <kbd>:</kbd> to open the command line, <kbd>Enter</kbd> runs it, <kbd>Esc</kbd> cancels.</p>
      <p><kbd>:help</kbd> every command</p>
      <p><kbd>:quest</kbd> what to do next</p>
      <p><kbd>:help w</kbd> explain a spell</p>
    </div>
  </aside>
</div>

<div id="dialog" class="win" hidden><div id="who"></div><p id="say"></p><span class="more">▼</span></div>
<div id="flash"></div>
<div id="cmd"></div>

<div id="battle" hidden>
  <div class="bwrap">
    <div class="arena">
      <div class="fighter"><div class="sprite" id="foeIcon"></div><div class="win stat"><div id="foeName"></div><div class="bar"><i id="foeHP"></i></div><div id="round"></div></div></div>
      <div class="fighter"><div class="sprite" id="meIcon"><span class="term">&gt;<i>_</i></span></div><div class="win stat"><div id="meName"></div><div class="bar me"><i id="meHP"></i></div><div id="meHPtxt"></div></div></div>
    </div>
    <div class="win lesson"><div class="keys" id="bKeys"></div><p id="bLearn"></p></div>
    <div class="panes" id="bPanes">
      <div class="pane"><h4>YOUR TEXT</h4><div class="buf" id="bBuf"></div></div>
      <div class="pane" id="bGoalPane"><h4>GOAL</h4><div class="buf" id="bGoal"></div></div>
    </div>
    <div class="status"><span class="mode" id="bMode"></span><span class="pending" id="bPending"></span><span id="bCount"></span><span id="bNote"></span></div>
    <div class="actions">
      <span class="help">:hint ask the sage (−5 HP) · :e! restart round · :q flee</span>
      <span id="bHint"></span>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="game.js"></script>
<script src="story.js"></script>
<script>
  const { Run, LEVELS, stars, locked } = VT;
  const { World, makeRound, rng, LV, ROUNDS, BOSS_ROUNDS } = GAME;
  const { CHAPTERS, MONSTERS, ENDING } = STORY;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  const HERO_HP = 30, MAX_HEARTS = 5, SAVE = 'rmvt-rpg';

  // ---------- state ----------
  const fresh = () => ({ ch: 0, lines: null, pos: null, spawn: null, learned: [], best: {}, seen: [], hearts: 3, gold: 0, keys: 0, done: false });
  let S = fresh();
  try { S = { ...S, ...JSON.parse(localStorage.getItem(SAVE)) }; } catch {}
  let world, face = 1, B = null;
  const CH = () => CHAPTERS[S.ch];
  const learnedSet = () => new Set(['hjkl', ...S.learned]);
  const level = () => 1 + Object.keys(S.best).length;
  const spellKeys = id => LV[id].keys.map(k => k[0]).join(' ');
  function save() {
    S.lines = [...world.lines]; S.pos = { r: world.r, c: world.c };
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch {}
  }
  // a save made before a map update keeps the old layout: reload the map, keep beaten gates open
  const shape = rows => rows.map(r => r.replace(/[$%+|A-E@MW]/g, ' ')).join('\n');
  function loadWorld() {
    if (S.lines && shape(S.lines) !== shape(CH().map)) { S.lines = null; S.pos = null; S.spawn = null; }
    world = new World(CH(), S.lines);
    CH().levels.forEach((id, i) => { const p = S.best[id] != null && world.find(String.fromCharCode(65 + i)); if (p) world.set(p.r, p.c, ' '); });
    if (S.pos) world.place(S.pos.r, S.pos.c);
    S.spawn ||= { ...world.start };
  }

  // ---------- dialog ----------
  let Q = [], qDone = null, typing = null, full = '';
  function say(lines, done) { Q = lines.slice(); qDone = done || null; nextLine(); }
  function nextLine() {
    const ln = Q.shift();
    if (!ln) { $('dialog').hidden = true; const f = qDone; qDone = null; if (f) f(); return; }
    $('dialog').hidden = false;
    $('who').textContent = ln[0];
    full = ln[1];
    let i = 0;
    clearInterval(typing);
    typing = setInterval(() => { $('say').textContent = full.slice(0, ++i); if (i >= full.length) { clearInterval(typing); typing = null; } }, 16);
  }
  function dialogKey(k) {
    if (k !== '<CR>' && k !== ' ') return;
    if (typing) { clearInterval(typing); typing = null; $('say').textContent = full; } else nextLine();
  }
  const note = t => { $('note').textContent = t; };

  // ---------- overworld ----------
  function tile(t, r, c) {
    const ch = CH();
    if (t === '#') return ['wall', ch.wall];
    if (t === '^') return ['wall', '⛰️'];
    if (t === '~') return ['water', ''];
    if (t === '=') return ['stone', ''];
    if (t === '.') return [rowsAround(r, c).includes('~') ? 'island' : 'path', ''];
    const icons = { $: '💰', '%': '❤️', '+': '🗝️', '|': '🚪', '>': '🌀', H: '🏠' };
    if (icons[t]) return ['', icons[t]];
    if (t === '&') return ['', ch.npcs[world.npcAt[r + ',' + c]].icon];
    if (t >= 'a' && t <= 'e') return ['', ch.sages[t.charCodeAt(0) - 97].icon];
    if (t >= 'A' && t <= 'E') return ['foe-tile', MONSTERS[ch.levels[t.charCodeAt(0) - 65]].icon];
    return ['', ''];
  }
  // a path tile surrounded by water is drawn as an island
  const rowsAround = (r, c) => [world.at(r, c - 1), world.at(r, c + 1), world.at(r - 1, c), world.at(r + 1, c)].join('');

  function draw() {
    const ch = CH(), rows = world.lines, ro = new Set(world.roamers.map(m => m.r + ',' + m.c));
    let h = '';
    rows.forEach((row, r) => {
      h += `<div class="g">${r + 1}</div>`;
      [...row].forEach((t, c) => {
        let [cls, e] = tile(t, r, c);
        if (r === world.r && c === world.c) e = `<span class="hero"><span class="term">${face < 0 ? '<i>_</i>&lt;' : '&gt;<i>_</i>'}</span></span>`;
        else if (ro.has(r + ',' + c)) e = `<span class="roam">${ch.roamer}</span>`;
        h += `<div class="t ${cls}">${e}</div>`;
      });
    });
    const map = $('map');
    map.style.setProperty('--floor', ch.floor);
    map.style.gridTemplateColumns = `auto repeat(${rows[0].length}, var(--t))`;
    map.innerHTML = h;
    map.querySelector('.hero').scrollIntoView({ block: 'center', inline: 'center' });
    $('mPending').textContent = world.nav.pending;
    hud();
  }
  function hud() {
    $('chap').textContent = CH().name;
    $('hearts').textContent = '❤️'.repeat(S.hearts) + '🖤'.repeat(Math.max(0, 3 - S.hearts));
    $('gold').textContent = `💰 ${S.gold}`;
    $('keysHud').textContent = `🗝️ ${S.keys}`;
    $('lv').textContent = `LV ${level()}`;
    $('stars').textContent = `★ ${Object.values(S.best).reduce((a, b) => a + b, 0)}/${LEVELS.length * 3}`;
    $('book').innerHTML = LEVELS.map(lv => {
      if (!S.learned.includes(lv.id)) return '';
      const beaten = S.best[lv.id] != null, m = MONSTERS[lv.id];
      return `<button class="spell" tabindex="-1" ${beaten ? `data-id="${lv.id}"` : ''}>${beaten ? m.icon : '📜'} ${esc(lv.title)}<b>${beaten ? '★'.repeat(S.best[lv.id]) : ''}</b><small>${esc(spellKeys(lv.id))}</small></button>`;
    }).join('') || '<span class="help">Find a sage to learn your first spell.</span>';
  }

  function mapKey(k) {
    if (k === '<CR>' || k === '<BS>') return;
    if (k.startsWith('Arrow')) return note('☠ The Arrow Curse! Your arrow keys are frozen. Use h j k l.');
    const ev = world.key(k, learnedSet());
    if (ev.wait) return draw();
    note('');
    if (ev.locked === 'unknown') note('Nothing happens.');
    else if (ev.locked === 'battle') note('That spell edits text — it only works in battle.');
    else if (ev.locked) note(`🔒 You haven't learned that yet (${LV[ev.locked].title}). Find the sage!`);
    if (ev.face) face = ev.face;
    if (ev.blocked) note('You can\'t land there.');
    for (const t of ev.picked) {
      if (t === '$') { S.gold += 10; note('💰 Treasure! +10 gold'); }
      if (t === '%') { S.hearts = Math.min(MAX_HEARTS, S.hearts + 1); note('❤️ You feel healthier.'); }
      if (t === '+') { S.keys++; note('🗝️ You found a key!'); }
    }
    if (ev.hurt) return hurt();
    if (ev.exit) return nextChapter();
    if (ev.bump) bump(ev.bump);
    save(); draw();
  }

  function hurt() {
    S.hearts--;
    $('flash').style.opacity = .5; setTimeout(() => { $('flash').style.opacity = 0; }, 150);
    if (S.hearts <= 0) {
      S.hearts = 3; world.place(world.start.r, world.start.c);
      say([['💀', `${CH().roamer} got you! Prompt fainted and woke up at the start of the chapter.`]], draw);
    } else {
      world.place(S.spawn.r, S.spawn.c);
      note(`Ouch! ${CH().roamer} got you. Back to your last sage.`);
    }
    save(); draw();
  }

  function bump({ r, c, t }) {
    const ch = CH();
    if (t >= 'a' && t <= 'e') {
      const sage = ch.sages[t.charCodeAt(0) - 97], id = ch.levels[t.charCodeAt(0) - 97], who = `${sage.icon} ${sage.name}`;
      if (S.learned.includes(id)) return say([[who, LV[id].learn]]);
      return say([...sage.say.map(s => [who, s]), [who, LV[id].learn], ['📜 New spell', `${LV[id].title}: ${spellKeys(id)}`]], () => {
        S.learned.push(id); S.spawn = { r: world.r, c: world.c }; save(); draw();
      });
    }
    if (t >= 'A' && t <= 'E') {
      const id = ch.levels[t.charCodeAt(0) - 65], m = MONSTERS[id], who = `${m.icon} ${m.name}`;
      if (!S.learned.includes(id)) return say([[who, m.taunt], ['>_ Prompt', 'I can\'t beat it yet... I need to find the sage who knows its weakness.']]);
      return say([[who, m.taunt]], () => startBattle(id, false));
    }
    if (t === '&') { const n = ch.npcs[world.npcAt[r + ',' + c]]; return say(n.say.map(s => [`${n.icon} ${n.name}`, s])); }
    if (t === '|') {
      if (!S.keys) return note('🚪 Locked. You need a key 🗝️.');
      S.keys--; world.set(r, c, ' '); note('🗝️ The door creaks open.');
    }
    if (t === 'H') note('🏠 Someone\'s home. The door is shut.');
  }

  function nextChapter() {
    if (S.ch + 1 >= CHAPTERS.length) return;
    S.ch++; S.lines = null; S.pos = null; S.spawn = null;
    loadWorld(); save(); draw(); intro();
  }
  function intro() {
    if (S.seen.includes(S.ch)) return;
    S.seen.push(S.ch); save();
    say(CH().intro);
  }

  // ---------- battle ----------
  function lev(a, b) {
    let p = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const q = [i];
      for (let j = 1; j <= b.length; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      p = q;
    }
    return p[b.length];
  }
  function startBattle(id, training) {
    const m = MONSTERS[id];
    B = { id, training, R: rng(Date.now() | 0), round: 0, total: id === 'boss' ? BOSS_ROUNDS : ROUNDS, hp: HERO_HP, keys: 0, par: 0, state: 'fight' };
    $('foeIcon').className = 'sprite'; $('foeIcon').textContent = m.icon;
    $('foeName').textContent = m.name;
    $('meName').textContent = `PROMPT  LV ${level()}`;
    $('battle').hidden = false;
    newRound();
  }
  function newRound() {
    B.lv = makeRound(B.id, B.R, B.round, learnedSet());
    B.run = new Run(B.lv);
    B.d0 = B.run.gemMode ? 1 : lev(B.lv.start, B.lv.goal) || 1;
    B.hint = ''; B.note = B.round ? '' : (B.run.gemMode ? 'Land on every ★ to win the round.' : 'Make your text match the goal, then press Esc.');
    const lv = LV[B.id];
    $('bKeys').innerHTML = lv.keys.map(([k, d]) => `<span><kbd>${esc(k)}</kbd> ${esc(d)}</span>`).join('');
    $('bLearn').textContent = lv.learn;
    $('bGoalPane').hidden = B.run.gemMode;
    $('bPanes').classList.toggle('solo', B.run.gemMode);
    renderBattle();
  }
  const roundLeft = () => { const r = B.run; return r.gemMode ? 1 - r.got.size / r.gems : Math.min(1, lev(r.vim.text, r.level.goal) / B.d0); };
  function hit(id) { const el = $(id); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  function battleKey(k) {
    if (B.state === 'lost') { if (k === '<CR>') startBattle(B.id, B.training); return; }
    if (B.state !== 'fight') return;
    if (k.startsWith('Arrow')) { B.hp -= 3; B.note = '☠ The Arrow Curse burns! −3 HP'; hit('meIcon'); return afterHit(); }
    const miss = locked(B.run.vim, k, learnedSet());
    if (miss) { B.run.vim.pending = ''; B.note = `🔒 You haven't learned ${LV[miss].title} yet.`; return renderBattle(); }
    const before = roundLeft();
    B.run.press(k);
    B.note = B.run.vim.msg;
    if (B.run.keys > B.lv.par) { B.hp--; hit('meIcon'); }
    if (roundLeft() < before) hit('foeIcon');
    if (B.run.done) return roundWon();
    afterHit();
  }
  function afterHit() {
    if (B.hp <= 0) { B.hp = 0; B.state = 'lost'; B.note = '💀 Prompt fainted! Press Enter to try again, or :q to flee.'; }
    renderBattle();
  }
  function roundWon() {
    B.keys += B.run.keys; B.par += B.lv.par; B.round++;
    B.state = 'pause';
    B.note = B.round >= B.total ? '💥 Final blow!' : `💥 Round ${B.round} cleared! ${B.run.keys <= B.lv.par ? 'Within par!' : ''}`;
    renderBattle();
    setTimeout(() => {
      if (B.round >= B.total) { $('foeIcon').classList.add('dead'); return setTimeout(winBattle, 700); }
      B.state = 'fight'; newRound();
    }, 800);
  }
  function winBattle() {
    const { id, training, keys, par } = B, m = MONSTERS[id], s = stars({ par }, keys), first = S.best[id] == null;
    S.best[id] = Math.max(S.best[id] || 0, s);
    $('battle').hidden = true; B = null;
    if (!training) { const p = world.find(String.fromCharCode(65 + CH().levels.indexOf(id))); if (p) world.set(p.r, p.c, ' '); }
    const lines = [['⚔️ Victory', `${m.name} was defeated! ${'★'.repeat(s)}${'☆'.repeat(3 - s)}  ${keys} keystrokes (par ${par}).`]];
    if (first) lines.push(['>_ Prompt', `I grew stronger! Now LV ${level()}.`]);
    if (id === 'boss' && first) { S.done = true; lines.push(...ENDING); }
    save(); draw();
    say(lines, draw);
  }
  function line(run, l, r, v, cls) {
    let h = '';
    const n = Math.max(l.length, v && r === v.r ? v.c + 1 : 0, 1);
    for (let c = 0; c < n; c++) {
      const ch = l[c] ?? ' ';
      let k = run.gemMode && ch === '*' ? (run.got.has(r + ',' + c) ? 'got' : 'gem') : '';
      if (v && r === v.r && c === v.c) k += v.mode === 'insert' ? ' cur ins' : ' cur';
      h += k ? `<span class="${k}">${esc(ch)}</span>` : esc(ch);
    }
    return `<div class="ln ${cls}"><i>${r + 1}</i>${h}</div>`;
  }
  function renderBattle() {
    const run = B.run, v = run.vim, goal = run.level.goal?.split('\n');
    $('bBuf').innerHTML = v.lines.map((l, r) => line(run, l, r, v, goal && l !== goal[r] ? 'bad' : '')).join('');
    if (goal) $('bGoal').innerHTML = goal.map((l, r) => line(run, l, r, null, l === v.lines[r] ? 'ok' : '')).join('');
    const foe = B.state === 'pause' ? (B.total - B.round) / B.total : (B.total - B.round - 1 + roundLeft()) / B.total;
    $('foeHP').style.width = foe * 100 + '%';
    $('round').textContent = `ROUND ${Math.min(B.round + 1, B.total)}/${B.total}`;
    $('meHP').style.width = (B.hp / HERO_HP) * 100 + '%';
    $('meHPtxt').textContent = `HP ${B.hp}/${HERO_HP}`;
    $('bMode').textContent = v.mode === 'insert' ? '-- INSERT --' : 'NORMAL';
    $('bMode').className = 'mode ' + v.mode;
    $('bPending').textContent = v.pending;
    $('bCount').textContent = `keys ${run.keys} / par ${B.lv.par}` + (run.gemMode ? `  ·  ★ ${run.got.size}/${run.gems}` : '') + (run.keys > B.lv.par ? '  · over par: each key hurts!' : '');
    $('bNote').textContent = B.note || '';
    $('bHint').textContent = B.hint ? `Sage whispers: ${B.hint}` : '';
  }
  $('book').onclick = e => { const b = e.target.closest('[data-id]'); if (b && !B && $('dialog').hidden) startBattle(b.dataset.id, true); };

  // ---------- : command line ----------
  let cmd = null;
  const showCmd = (t, err) => { $('cmd').textContent = t; $('cmd').className = err ? 'err' : ''; };
  const canCmd = () => (B ? B.state === 'lost' || (B.state === 'fight' && B.run.vim.mode === 'normal' && !B.run.vim.pending) : !world.nav.pending);
  function cmdKey(k) {
    if (k === '<Esc>' || (k === '<BS>' && !cmd)) { cmd = null; return showCmd(''); }
    if (k === '<CR>') { const c = cmd.trim(); cmd = null; showCmd(''); return runCmd(c); }
    if (k === '<BS>') cmd = cmd.slice(0, -1); else if (k.length === 1) cmd += k;
    showCmd(':' + cmd + '▏');
  }
  const findSpell = a => LEVELS.find(l => l.id === a || l.title.toLowerCase().includes(a.toLowerCase()) || l.keys.some(([k]) => k.split(' ').includes(a)));
  const HELP = [
    ['📜 :help', 'Commands start with : and run with Enter (Esc cancels). :help {key or spell} explains a spell you learned, e.g. :help w or :help find'],
    ['📜 Exploring', ':quest what to do next · :spells your spellbook · :stats your hero · :back return to the last sage (also Ctrl-o) · :train {spell} fight a beaten monster again'],
    ['📜 In battle', ':hint the sage shows a solution (−5 HP) · :e! restart the round · :q flee'],
    ['📜 Saving', 'The game saves itself after every move. :w saves anyway · :new! throws everything away and starts a new adventure'],
    ['📜 Controls', 'Walk into people to talk and into monsters to fight. Enter or Space continues talking. Roaming monsters move once per command, so leaps and counted dashes outrun them. Arrow keys are cursed.'],
  ];
  function quest() {
    const ch = CH(), gate = i => world.find(String.fromCharCode(65 + i));
    let next = null;
    ch.levels.forEach((id, i) => {
      if (next) return;
      if (!S.learned.includes(id)) next = `find ${ch.sages[i].icon} ${ch.sages[i].name}, who teaches ${LV[id].title}.`;
      else if (gate(i)) next = `defeat ${MONSTERS[id].icon} ${MONSTERS[id].name} with ${LV[id].title} (${spellKeys(id)}).`;
    });
    next ||= world.find('>') ? 'find the exit 🌀 to the next chapter.' : S.done ? 'you saved Textoria! Hunt ★★★ with :train.' : 'face Lord Clicker.';
    const n = ch.levels.length, gold = world.lines.join('').split('$').length - 1;
    say([[`🗺️ ${ch.name}`, `Next: ${next}`],
      ['🗺️ Progress', `Sages ${ch.levels.filter(id => S.learned.includes(id)).length}/${n} · monsters beaten ${ch.levels.filter((_, i) => !gate(i)).length}/${n} · treasure left here ${gold} 💰`]]);
  }
  function runCmd(c) {
    const [name = '', ...rest] = c.split(/\s+/), arg = rest.join(' ');
    const err = t => showCmd(t, true);
    const notInBattle = () => B && err('E: not now, you are in a battle! (:q to flee)');
    switch (name) {
      case '': return;
      case 'h': case 'help': {
        if (!arg) return say(HELP);
        const lv = findSpell(arg);
        if (!lv || !S.learned.includes(lv.id)) return err(`E149: Sorry, no help for ${arg} — no sage has taught you that yet`);
        return say([[`📜 ${lv.title}`, lv.learn], ['📜 Keys', lv.keys.map(([k, d]) => (d ? `${k} ${d}` : k)).join(' · ')]]);
      }
      case 'quest': case 'where': case 'map': return notInBattle() || quest();
      case 'spells': case 'book': {
        const list = LEVELS.filter(l => S.learned.includes(l.id)).map(l => `${l.title} (${spellKeys(l.id)}) ${'★'.repeat(S.best[l.id] || 0)}`);
        return say([['📖 Spellbook', list.join(' · ') || 'Empty. Find a sage!']]);
      }
      case 'stats': {
        const total = Object.values(S.best).reduce((a, b) => a + b, 0);
        return say([['>_ Prompt', `LV ${level()} · ❤️ ${S.hearts}/${MAX_HEARTS} · 💰 ${S.gold} · 🗝️ ${S.keys} · ★ ${total}/${LEVELS.length * 3} · spells ${S.learned.length}/${LEVELS.length}`]]);
      }
      case 'back': if (notInBattle()) return; world.place(S.spawn.r, S.spawn.c); save(); draw(); return showCmd('⏪ Back to your last sage.');
      case 'train': {
        if (notInBattle()) return;
        const lv = arg && findSpell(arg);
        if (!lv) return err('E471: Argument required: :train {spell}, e.g. :train hjkl');
        if (S.best[lv.id] == null) return err(`You haven't defeated ${MONSTERS[lv.id].name} yet.`);
        return startBattle(lv.id, true);
      }
      case 'hint':
        if (!B || B.state !== 'fight') return err('E: the sage only whispers during a battle');
        B.hp -= 5; B.hint = B.lv.solution; return afterHit();
      case 'e!': case 'e':
        if (!B || B.state !== 'fight') return err('E32: No file name');
        B.run = new Run(B.lv); B.note = '↺ Round restarted.'; return renderBattle();
      case 'q': case 'q!': case 'quit':
        if (!B) return err('E37: There is no escape from Textoria! (the game saves itself — just close the tab)');
        $('battle').hidden = true; B = null; draw(); return showCmd('🏃 You fled. The monster is still there...');
      case 'w': save(); return showCmd('"textoria.sav" written');
      case 'wq': case 'x': save(); return showCmd('"textoria.sav" written. See you soon, Prompt!');
      case 'new': return err('E37: Your adventure is not finished! Use :new! to start over');
      case 'new!':
        if (B) { $('battle').hidden = true; B = null; }
        S = fresh(); loadWorld(); save(); draw(); return intro();
      default: return err(`E492: Not an editor command: ${c}`);
    }
  }

  // ---------- input ----------
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.altKey) return;
    let k = e.key;
    if (e.ctrlKey) {
      if (k === 'o' && !B && $('dialog').hidden) { e.preventDefault(); world.place(S.spawn.r, S.spawn.c); note('⏪ Back to your last sage.'); save(); return draw(); }
      if (k === '[' || k === 'c') k = '<Esc>'; else return;
    } else if (k === 'Escape') k = '<Esc>';
    else if (k === 'Enter') k = '<CR>';
    else if (k === 'Backspace') k = '<BS>';
    else if (k.length !== 1 && !k.startsWith('Arrow')) return;
    e.preventDefault();
    if (cmd !== null) return cmdKey(k);
    if (!$('dialog').hidden) return dialogKey(k);
    if (k === ':' && canCmd()) { cmd = ''; return showCmd(':▏'); }
    showCmd('');
    if (B) return battleKey(k);
    mapKey(k);
  });

  loadWorld(); draw(); intro();
</script>
</body>
</html>
